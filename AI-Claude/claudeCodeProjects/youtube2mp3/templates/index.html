<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadTube</title>
    <link rel="icon" type="image/x-icon" href="/static/gadtube.ico">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header class="header">
        <div class="header-left">
            <button class="logo" onclick="goHome()" aria-label="GadTube home">
                <span class="logo-gad">Gad</span><span class="logo-tube">Tube</span>
            </button>
        </div>
        <div class="header-center">
            <form class="search-form" id="search-form">
                <input
                    type="text"
                    id="search-input"
                    class="search-input"
                    placeholder="Search"
                    autocomplete="off"
                    aria-label="Search"
                >
                <button type="submit" class="search-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M20.87 20.17l-5.59-5.59C16.35 13.35 17 11.75 17 10c0-3.87-3.13-7-7-7s-7 3.13-7 7 3.13 7 7 7c1.75 0 3.35-.65 4.58-1.71l5.59 5.59.7-.71zM10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/>
                    </svg>
                </button>
            </form>
        </div>
        <div class="header-right"></div>
    </header>

    <main>
        <!-- Search / Home view -->
        <div id="view-search" class="view active">
            <div id="search-placeholder" class="placeholder">
                <div class="placeholder-icon">
                    <svg viewBox="0 0 90 90" width="90" height="90" fill="#272727">
                        <rect x="5" y="10" width="80" height="55" rx="6"/>
                        <polygon points="35,25 65,37 35,50" fill="#0f0f0f"/>
                        <rect x="25" y="72" width="40" height="8" rx="4"/>
                    </svg>
                </div>
                <p>Search for videos to get started</p>
            </div>
            <div id="results-grid" class="results-grid"></div>
        </div>

        <!-- Player view -->
        <div id="view-player" class="view">
            <div class="player-layout">
                <div class="player-main">
                    <button class="back-btn" onclick="goHome()">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                        </svg>
                        Back to results
                    </button>
                    <div id="player-container">
                        <div id="youtube-player"></div>
                    </div>
                    <div class="video-info">
                        <h1 id="video-title" class="video-title"></h1>
                        <div class="video-meta">
                            <span id="video-channel" class="channel-name"></span>
                        </div>
                        <div class="download-row">
                            <button id="download-btn" class="download-btn" onclick="downloadMp3()">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                                </svg>
                                Download MP3
                            </button>
                            <span id="download-status" class="download-status"></span>
                        </div>
                        <p id="video-description" class="video-description"></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="/static/app.js"></script>
</body>
</html>
