<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Page Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
        crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style5.css">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
        crossorigin="anonymous"></script>
</head>

<body>

    <div class="modal-header">       
        <h4 class="modal-title" id="Heading">Edit User</h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        <!-- <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="activeModal.dismiss('Cross click')"><span
            aria-hidden="true"><i class="fa fa-times" aria-hidden="true"></i></span></button> -->
    </div>
    <div class="modal-body">
        <form [formGroup]="editForm" novalidate (ngSubmit)="onUpdate()" autocomplete="on">
            <flash-messages></flash-messages>
            <div class="form-group">
                <label for="manager">Manager</label>
                <input type="text" name="manager" formControlName="manager" class="form-control" id="manager"
                    placeholder="Enter Manager Name" [ngClass]="{ 'is-invalid': submitted && f.manager.errors }">
                <div *ngIf="submitted && f.firstName.errors" class="invalid-feedback">
                    <div *ngIf="f.firstName.errors.required">Manager Name is required</div>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" formControlName="email" class="form-control" id="email" autocomplete="username email"
                    aria-describedby="emailHelp" placeholder="Enter Email" [ngClass]="{ 'is-invalid': submitted && f.email.errors }">
                <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
                    <div *ngIf="f.email.errors.required">Email is required</div>
                    <div *ngIf="f.email.errors.email">Email must be a valid email address</div>
                </div>
                <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" formControlName="password" class="form-control" id="password"
                    autocomplete="current-password" placeholder=" Enter Password" [ngClass]="{ 'is-invalid': submitted && f.password.errors }">
                <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
                    <div *ngIf="f.password.errors.required">Password is required</div>
                    <div *ngIf="f.password.errors.minlength">Password must be at least 6 characters</div>
                </div>
            </div>

            <div class="form-group">
                <label for="userRole">Roles</label>
                <select class="form-control dropdown" id="userRole" formControlName="selectedRole">
                    <option *ngFor="let role of roles" [value]="role">{{role.name}}</option>
                </select>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" name="phone" class="form-control" formControlName="phone" id="phone" placeholder="Enter Phone Number">
            </div>

            <div class="form-group">
                <label for="seatLimit">Seats Limit</label>
                <input type="number" name="seatLimit" class="form-control" formControlName="seatLimit" id="seatLimit"
                    placeholder="Enter Seats Limit">
            </div>

            <div class="form-group">
                <label for="fixedPrice">Fixed Price</label>
                <input type="number" name="fixedPrice" class="form-control" formControlName="fixedPrice" id="fixedPrice"
                    placeholder="Enter Fixed Price">
            </div>

            <div class="form-group">
                <label for="currentPrice">Current Price </label>
                <input type="number" name="currentPrice" class="form-control" formControlName="currentPrice" id="currentPrice"
                    placeholder="Enter Current Price">
            </div>

            <div class="form-group">
                <label for="initialCredit">Credit</label>
                <input type="number" name="initialCredit" class="form-control" formControlName="initialCredit" id="initialCredit"
                    placeholder="Enter Credit">
            </div>
        </form>
    </div>
    <div class="modal-footer ">
        <button type="button" class="btn btn-warning btn-lg" style="width: 100%;"><span (click)="closeModal()">
            </span><i class="fa fa-check" aria-hidden="true"></i> Update</button>
    </div>


</body>

</html>
