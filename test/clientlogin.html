<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Page Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
        crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="pt-5 pb-5 mt-5">
        <div class="container heb">
            <form>
                <div class="form-group row">
                  <h3 class="col-3 pr-0">כניסת לקוח</h3>
                </div>
                <div class="form-group row">
                    <input type="text" class="form-control col-3" id="username" placeholder="שם משתמש" required>
                </div>

                <div class="form-group row">
                    <input type="password" name="password" id="password" class="form-control col-3" placeholder="סיסמה"
                        required>                    
                </div>

                <div class="form-group row"> 
                  <a href="_blank">
                      <small id="helpId" class="text-muted">שכחתי סיסמה</small>
                </a>
                </div>             

                <div class="form-group row">
                    <div class="form-check form-check-inline mr-0">
                        <input type="checkbox" class="form-check-input mr-0 ml-2" id="exampleCheck1">
                    </div>
                    <label class="form-check-label" for="exampleCheck1">אני מעוניין לקבל עדכונים ומבצעים למייל</label>
                </div>  
                
                <div class="form-group row">
                    <button type="submit" class="btn btn-primary">
                        התחבר
                        <figure class="figure">
                            <img src="images/SIMBOLE-BLUE.png" class="figure-img img-fluid rounded" alt="">                            
                        </figure>
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
