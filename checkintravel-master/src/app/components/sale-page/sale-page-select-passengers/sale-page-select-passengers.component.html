<div id="flight-search" class="border select-passengers d-inline-flex align-items-center w-100 heb">
  <form class="form-inline w-100" [formGroup]="selectPassengers" (ngSubmit)="onContinueClick()">
    <div class="pr-5">
      <select class="form-conrol drop-down-colors drop-down-width" name="adults" formControlName="adults">
        <option selected disable>מבוגרים</option>
        <option *ngFor="let passenger of passengers" [ngValue]="passenger">{{passenger}}</option>
      </select>
    </div>

    <div class="pr-5">
      <select class="form-conrol drop-down-colors drop-down-width" name="infants" formControlName="infants">
        <option selected disable>תינוקות</option>
        <option *ngFor="let passenger of passengers" [ngValue]="passenger">{{passenger}}</option>
      </select>
    </div>

    <div class="mr-auto pl-5">
      <button class="form-conrol" type="submit" class="btn btn-primary btn-colors">
         המשך
         <span>
            <img src="../../../assets/images/SIMBOLE-WHITE.png" class="img-fluid" alt="" style="width:1rem;height: 1rem;">
          </span>
      </button>
    </div>
  </form>
</div>
