<div class="border-margin">
  <form name="form" (ngSubmit)="f.form.valid && onPayment()" #f="ngForm" novalidate>
    <div class="pt-5 pb-5 mt-5 bottom-border-gold heb">

      <div class="form-group row">
        <p class="form-text col-4 color-blue font-weight-bold">
          אנא מלאו את פרטי הנוסעים באנגלית בלבד וכפי שמופיע בדרכון הנוסע.
        </p>
      </div>

      <ul class="list-unstyled pr-0">
        <li *ngFor="let item of passengers;let index = index;trackBy:trackByIndex;">
          <div class="form-group row">
            <div class="col-3 ">
              <ng-container *ngIf="!passengers[index].isInfant; else elseTemplate">
                <img class="gender-size" [src]="getMRGenderImage(passengers[index])" alt="" srcset=""
                  (click)="onMRClicked(passengers[index])">
                <img class="gender-size mr-2" [src]="getMSGenderImage(passengers[index])" alt="" srcset=""
                  (click)="onMSClicked(passengers[index])">
              </ng-container>
              <ng-template #elseTemplate>
                <img class="gender-size mr-2" [src]="getINFGenderImage(passengers[index])" alt="" srcset="">
              </ng-template>
            </div>
          </div>

          <div class="form-group row">
            <div class="col-3">
              <input type="text" class="form-control set-colors" id="first-name" placeholder="שם פרטי" required
                [(ngModel)]="passengers[index].firstname" name=firstname{{index}}>
            </div>
          </div>

          <div class="form-group row">
            <div class="col-3">
              <input type="text" name="last-name" id="last-name" class="form-control set-colors" placeholder="שם משפחה"
                required [(ngModel)]="passengers[index].lastname" name=lastname{{index}}>
            </div>
          </div>
        </li>
      </ul>

      <div class="form-group row">
        <div class="col-4">
          <input type="email" class="form-control set-colors" name="email" id="email" placeholder="אימייל"
            [(ngModel)]="email" required email>
          <!-- <div *ngIf="f.submitted && f.email.invalid" class="invalid-feedback">
            <div *ngIf="f.email.errors.required">Email is required</div>
          </div> -->
        </div>
      </div>

      <div class="form-group row">
        <div class="col-2">
          <select class="form-control form-inline set-colors" name="country" id="country" [(ngModel)]="country">
            <option selected>ישראל</option>
          </select>
        </div>

        <div class="col-2">
          <input type="tel" class="form-control form-inline set-colors" name="tel" id="tel" placeholder="טלפון"
            [(ngModel)]="tel" required>
          <!-- <div *ngIf="f.submitted && f.tel.invalid" class="invalid-feedback">
            <div *ngIf="f.tel.errors.required">Phone is required</div>
          </div> -->
        </div>
      </div>

      <div class="form-group row">
        <div class="col-4">
          <div class="form-check form-check-inline mr-0">
            <input type="checkbox" class="form-check-input mr-0 mt-2 " id="exampleCheck1" [(ngModel)]="terms"
              name="terms" required>
          </div>
          <label class="form-check-label mr-1 mt-2 color-blue" for="exampleCheck1">קראתי את תנאי האתר הכלליים ואת
            תנאי
            הביטול
            ואני מסכים.</label>
        </div>
      </div>
    </div>

    <div class="pt-5 pb-5 mt-5 heb">
      <div class="row">
        <div class="col-6">
          <div *ngIf="isClient">
            <h3><span class="ml-2"><img src="../../../assets/images/SIMBOLE-BLUE.png" class="img-fluid img-size"
                  alt=""></span>אשראי
            </h3>
          </div>
          <div class="col-8">
            <div class="form-group">
              <ul class="list-inline p-0 credit-list">

              </ul>

            <div class="form-group">
              <input id="cc-number" name="cc-number" type="tel" class="form-control set-colors cc-number identified"
                [(ngModel)]="cc_number" value="" data-val="true" data-val-required="Please enter the card number"
                data-val-cc-number="Please enter a valid card number" autocomplete="cc-number" maxlength="16" minlength="16"
                placeholder="מספר כרטיס אשראי">
              <span class="help-block" data-valmsg-for="cc-number" data-valmsg-replace="true"></span>
            </div>
            <div class="form-group has-success">
              <input id="cc-name" name="cc-name" type="text" class="form-control set-colors cc-name valid"
                data-val="true" data-val-required="Please enter the name on card" autocomplete="cc-name"
                aria-required="true" aria-invalid="false" aria-describedby="cc-name-error" [(ngModel)]="cc_holdername"
                placeholder="שם בעל הכרטיס">
              <span class="help-block field-validation-valid" data-valmsg-for="cc-name"
                data-valmsg-replace="true"></span>
            </div>
            <div class="row">
              <div class="col-1">
                <div class="form-group">
                  <label for="cc-exp" class="control-label">תוקף</label>
                </div>
              </div>
              <div class="col-3">
                <div class="form-group">
                  <input id="cc-exp-month" name="cc-exp-month" type="tel" class="form-control set-colors cc-exp"
                    value="" [(ngModel)]="cc_month" data-val="true"
                    data-val-required="Please enter the card expiration month"
                    data-val-cc-exp="Please enter a valid month" placeholder="חודש" autocomplete="cc-exp-month"
                    maxlength="2" minlength="2" min="" max="12">
                  <span class="help-block" data-valmsg-for="cc-exp" data-valmsg-replace="true"></span>
                </div>
              </div>
              <div class="col-3">
                <div class="form-group">
                  <input id="cc-exp-year" name="cc-exp-year" type="tel" class="form-control set-colors cc-exp" value=""
                    [(ngModel)]="cc_year" data-val="true" data-val-required="Please enter the card expiration year"
                    data-val-cc-exp="Please enter a valid year" placeholder="שנה" autocomplete="cc-exp-year"
                    maxlength="2" minlength="2" min="0" max="99">
                  <span class="help-block" data-valmsg-for="cc-exp" data-valmsg-replace="true"></span>
                </div>
              </div>
              <div class="col-2">
                <div class="form-group d-inline-flex">
                  <label for="cc-cvv-help">CVV</label>
                  <a name="cc-cvv-help" class="mr-1" ngbPopover="3 הספרות בגב הכרטיס..."
                    triggers="mouseenter:mouseleave">
                    <i class="fa fa-question-circle fa-lg"></i>
                  </a>
                </div>
              </div>
              <div class="col-3">
                <div class="input-group">
                  <input id="x_card_code" name="x_card_code" type="tel" class="form-control set-colors cc-cvc" value=""
                    [(ngModel)]="cc_cvv" data-val="true" data-val-required="Please enter the security code"
                    maxlength="3" minlength="3" data-val-cc-cvc="Please enter a valid security code" autocomplete="off"
                    placeholder="CVV">
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6" [ngClass]="{'client-border pr-5': isClient}">
          <div *ngIf="isClient">
            <h3><span class="ml-2"><img src="../../../assets/images/SIMBOLE-BLUE.png" class="img-fluid img-size"
                  alt=""></span>קרדיט
            </h3>
            <div class="mt-5">
              <div class="form-group row">
                <input type="text" class=" set-colors form-control col-6" id="userName" placeholder="שם משתמש"
                  name="userName" [(ngModel)]="username">
              </div>
              <div class="form-group row">
                <input type="password" name="clientNum" id="clientNum" class=" set-colors form-control col-6"
                  placeholder="סיסמא" name="clientNum" [(ngModel)]="password">
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="d-flex mt-5" [ngClass]="{'justify-content-center': isClient}">
        <button type="submit" class="btn btn-primary btn-colors mt-2 mt-sm-0"
          [disabled]="f.form.pristine || f.form.invalid || !genderSelected || (!hasCreditDetails() && !hasClientDetails())">
          <span>
            <img src="../../assets/images/SIMBOLE-WHITE.png" class="img-fluid img-size" alt="">
          </span> תשלום
        </button>
      </div>
      <flash-messages></flash-messages>
    </div>
  </form>
</div>
