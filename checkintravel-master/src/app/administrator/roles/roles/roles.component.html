<div class="container mt-5">
  <table class="table table-hover table-dark table-responsive ">
    <thead class="thead-inverse">
      <tr>
        <th scope="col">#</th>
        <th scope="col">Name</th>
        <th scope="col">Role</th>
        <th scope="col">Id</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let role of roles ; let i = index">
        <td scope="row">{{i+1}}</td>
        <td>{{role.name}}</td>
        <td>{{role.role}}</td>
        <td>{{role._id}}</td>
      </tr>
    </tbody>
  </table>
</div>
