<div class="modal-header">
  <h4 class="modal-title" id="Heading">Delete this entry</h4>
  <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="closeModal()">
    <span aria-hidden="true"><i class="fa fa-times" aria-hidden="true"></i></span>
  </button>
</div>
<div class="modal-body">

  <div class="alert alert-danger"><span><i class="fa fa-exclamation-triangle" aria-hidden="true"></i></span> Are you
    sure you want to delete this Record?</div>

</div>
<div class="modal-footer ">
  <button type="button" class="btn btn-success" (click)="onDelete()"><span><i class="fa fa-check" aria-hidden="true"></i></span> Yes</button>
  <button type="button" class="btn btn-default" data-dismiss="modal" (click)="closeModal()"><span><i class="fa fa-times"
        aria-hidden="true"></i></span> No</button>
</div>
