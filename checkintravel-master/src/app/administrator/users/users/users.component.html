<div class="container mt-5">
  <table class="table table-hover table-dark table-responsive ">
    <thead class="thead-inverse">
      <tr>
        <th scope="col">#</th>
        <th scope="col">Email</th>
        <th scope="col">Manager</th>
        <th scope="col">Role</th>
        <th scope="col">Edit</th>
        <th scope="col">Delete</th>
        <th scope="col">Report</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users ; let i = index">
        <td scope="row">{{i+1}}</td>
        <td>{{user.email}}</td>
        <td>{{user.manager}}</td>
        <td>{{user.role ? user.role.name : ""}}</td>
        <td>
          <!-- <p data-placement="top" data-toggle="tooltip" title="Edit"><button class="btn btn-primary btn-xs" data-title="Edit"
              data-toggle="modal" data-target="#edit"><span><i class="fa fa-pencil" aria-hidden="true"></i></span></button></p> -->
          <p data-toggle="tooltip" title="Edit">
            <button class="btn btn-primary btn-xs" (click)="openUserModal(user)">
              <span><i class="fa fa-pencil" aria-hidden="true"></i></span>
            </button>
          </p>
        </td>
        <td>
          <!-- <p data-placement="top" data-toggle="tooltip" title="Delete"> -->
          <p data-toggle="tooltip" title="Delete">
            <button class="btn btn-danger btn-xs" (click)="openUserDeleteModal(user)">
              <span><i class="fa fa-trash" aria-hidden="true"></i></span>
            </button>
          </p>
        </td>
        <td>
          <p data-toggle="tooltip" title="Report">
            <button class="btn btn-success btn-xs" (click)="onGenerateReport(user)">
              <span><i class="fa fa-table" aria-hidden="true"></i></span>
            </button>
          </p>
        </td>
      </tr>
    </tbody>
  </table>
  <!-- <a name="addUser" id="addUser" class="btn btn-primary" [routerLink]="['../',{outlets :{admin : ['register']}}]" role=" button">Add
    User</a> -->
    <button type="button" class="btn btn-primary" (click)="addUser()">Add</button>
</div>
