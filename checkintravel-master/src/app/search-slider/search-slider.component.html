<ngb-carousel *ngIf="images" [showNavigationArrows]="false" [showNavigationIndicators]="false">
  <ng-template ngbSlide>
    <img class="w-100 d-block" [src]="images[0]" alt="Random first slide">
  </ng-template>
  <ng-template ngbSlide>
    <img class="w-100 d-block" [src]="images[1]" alt="Random first slide">
  </ng-template>
  <ng-template ngbSlide>
    <img class="w-100 d-block" [src]="images[2]" alt="Random first slide">
  </ng-template>
</ngb-carousel>
